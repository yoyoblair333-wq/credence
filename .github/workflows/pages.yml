# Publishes the Credence dApp (frontend/) to GitHub Pages as a static site.
# The site talks to GenLayer straight from the browser; no server is involved.
name: Deploy dApp to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_BASE_PATH: /credence
      NEXT_PUBLIC_GENLAYER_RPC_URL: https://studio.genlayer.com/api
      NEXT_PUBLIC_GENLAYER_CHAIN_ID: "61999"
      NEXT_PUBLIC_GENLAYER_CHAIN_NAME: GenLayer Studio
      NEXT_PUBLIC_GENLAYER_SYMBOL: GEN
      # Live Credence v1.4 core on studionet (see docs/LIVE_EVIDENCE.md §1).
      NEXT_PUBLIC_CREDENCE_CONTRACT_ADDRESS: "0x8D9F4365b39bD2646d18e6ceCc9758344605f9ED"
      NEXT_PUBLIC_REPO_URL: https://github.com/yoyoblair333-wq/credence
      NEXT_PUBLIC_SITE_URL: https://yoyoblair333-wq.github.io/credence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
